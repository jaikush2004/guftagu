<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guftagu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24224f; --ink-soft: #3a3770; --bg: #f4f3fa; --card: #fff; --line: #e8e6f2;
    --text: #25233f; --muted: #7c7a9a; --accent: #f2a93b; --mine: #ffe6b3; --active: #eeecf8;
    --font-head: "Baloo 2", "Segoe UI", sans-serif; --font-body: "Hind", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 16px; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Auth ---------- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 20px; background: linear-gradient(160deg, var(--ink), var(--ink-soft)); }
  .card { width: 100%; max-width: 400px; background: var(--card); border-radius: 24px; padding: 36px 30px; box-shadow: 0 24px 60px rgba(0,0,0,.28); }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo-mark { width: 46px; height: 46px; border-radius: 14px 14px 14px 4px; background: var(--accent); display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 26px; color: var(--ink); }
  .logo h1 { font-family: var(--font-head); font-size: 32px; line-height: 1; color: var(--ink); }
  .tagline { color: var(--muted); margin-bottom: 22px; }
  .tabs { display: flex; background: #eceaf7; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 9px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
  input[type=text], input[type=password] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fbfbfe; }
  input:focus { border-color: var(--ink-soft); outline: none; box-shadow: 0 0 0 3px rgba(242,169,59,.45); }
  .btn { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: var(--ink); font-family: var(--font-head); font-weight: 700; font-size: 18px; cursor: pointer; }
  .btn:hover { background: #f5b653; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .err { color: #c0392b; font-size: 14px; min-height: 20px; margin-bottom: 8px; }

  /* ---------- App ---------- */
  #app { display: none; height: 100vh; height: 100dvh; position: relative; }
  .shell { display: grid; grid-template-columns: 360px 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; }
  .left { background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .left-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--ink); color: #fff; }
  .left-top .me { font-family: var(--font-head); font-size: 18px; flex: 1; }
  .left-top button { border: 1.5px solid rgba(255,255,255,.3); background: transparent; color: #fff; border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
  .left-top button:hover { background: rgba(255,255,255,.1); }
  .search { flex: none; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .search input { border-radius: 999px; padding: 10px 16px; background: var(--bg); }
  #list { flex: 1; overflow-y: auto; }
  .note { padding: 26px 22px; color: var(--muted); text-align: center; font-size: 15px; }
  .label { padding: 12px 18px 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #f1f0f8; }
  .item:hover { background: #f8f7fc; }
  .item.active { background: var(--active); }
  .item .body { flex: 1; min-width: 0; }
  .item .row1 { display: flex; justify-content: space-between; gap: 8px; }
  .item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .time { font-size: 12px; color: var(--muted); flex: none; }
  .item .preview { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-head); font-weight: 700; color: #fff; font-size: 20px; }
  .avatar.sm { width: 40px; height: 40px; font-size: 17px; }
  .av-wrap { position: relative; flex: none; }
  .av-wrap .dot { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: #3dbb7a; border: 2px solid #fff; }
  .item .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item .row2 .preview { flex: 1; min-width: 0; }
  .badge { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: var(--ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .item.unread .time { color: #b97a0a; font-weight: 600; }
  .item.unread .preview { color: var(--text); font-weight: 600; }

  .right { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .placeholder { margin: auto; text-align: center; color: var(--muted); max-width: 300px; padding: 20px; }
  .placeholder .logo-mark { margin: 0 auto 14px; width: 64px; height: 64px; font-size: 36px; }
  .placeholder b { display: block; font-family: var(--font-head); font-size: 22px; color: var(--ink); margin-bottom: 4px; }
  #chat { display: none; flex-direction: column; height: 100%; min-height: 0; }
  .chat-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .back { display: none; border: 0; background: transparent; font-size: 24px; cursor: pointer; color: var(--ink); }
  #chat-name { font-weight: 600; line-height: 1.2; }
  #chat-sub { font-size: 13px; color: var(--muted); min-height: 18px; }
  #chat-sub.live { color: #2a9d6a; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 8%; display: flex; flex-direction: column; gap: 6px;
    background-color: #efecf8; background-image: radial-gradient(rgba(36,34,79,.07) 1.3px, transparent 1.3px); background-size: 22px 22px; }
  .day { align-self: center; font-size: 12px; color: var(--muted); background: #fff; padding: 3px 12px; border-radius: 999px; margin: 8px 0; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .bubble { max-width: 70%; padding: 7px 12px 5px; border-radius: 14px 14px 14px 4px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1); overflow-wrap: anywhere; line-height: 1.4; }
  .bubble.mine { align-self: flex-end; background: var(--mine); border-radius: 14px 14px 4px 14px; }
  .bubble .t { font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
  .composer { flex: none; display: flex; gap: 10px; padding: 10px 16px 12px; background: var(--card); border-top: 1px solid var(--line); }
  .composer input { flex: 1; border-radius: 999px; padding: 12px 18px; background: var(--bg); }
  .send { width: 46px; height: 46px; border: 0; border-radius: 50%; background: var(--accent); color: var(--ink); cursor: pointer; display: grid; place-items: center; flex: none; }
  .send:hover { background: #f5b653; }
  .send svg { width: 22px; height: 22px; }
  #banner { display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: #c0392b; color: #fff; padding: 6px 16px; border-radius: 0 0 12px 12px; font-size: 14px; z-index: 5; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .right { display: none; }
    .shell.chat-open .left { display: none; }
    .shell.chat-open .right { display: flex; }
    .back { display: block; }
    #messages { padding: 14px 12px; }
    .bubble { max-width: 85%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<section id="auth">
  <div class="card">
    <div class="logo"><div class="logo-mark">ग</div><h1>Guftagu</h1></div>
    <p class="tagline">Dosto se seedhi baat.</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="active">Login</button>
      <button type="button" id="tab-signup">Naya account</button>
    </div>
    <div class="field"><label for="name">Username</label><input id="name" type="text" maxlength="20" placeholder="Jaise: jai_07" autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" maxlength="64" placeholder="Kam se kam 6 akshar" autocomplete="current-password"></div>
    <div class="err" id="auth-error"></div>
    <button class="btn" id="auth-btn">Login karo</button>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app">
  <div id="banner">Connection toot gaya, dobara connect ho raha hai...</div>
  <div class="shell" id="shell">
    <aside class="left">
      <header class="left-top"><span class="me" id="me"></span><button id="logout">Logout</button></header>
      <div class="search"><input id="search" type="text" placeholder="User dhundo, naya chat shuru karo" autocomplete="off"></div>
      <div id="list"></div>
    </aside>
    <main class="right">
      <div class="placeholder" id="placeholder">
        <div class="logo-mark">ग</div><b>Guftagu</b>
        Left side se koi chat chuno, ya search karke kisi dost se naya chat shuru karo.
      </div>
      <section id="chat">
        <header class="chat-top">
          <button class="back" id="back" aria-label="Wapas">←</button>
          <div id="chat-avatar"></div>
          <div><div id="chat-name"></div><div id="chat-sub"></div></div>
        </header>
        <div id="messages"></div>
        <div class="composer">
          <input id="msg" type="text" maxlength="500" placeholder="Message likho..." autocomplete="off">
          <button class="send" id="send" aria-label="Bhejo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 22 12 3.4 3.6 3.3 10l13 2-13 2z"/></svg></button>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  const COLORS = ["#e4572e", "#2e86ab", "#7b4fd1", "#2a9d8f", "#d1495b", "#c98412", "#4361ee", "#6a994e"];
  let token = "", username = "", mode = "login";
  let chats = [], activeId = null, ws = null, closing = false, wasDown = false;
  let reconnectTimer, typingTimer, searchTimer, lastTypingSent = 0, lastDay = "", typingNow = false;
  const $ = (id) => document.getElementById(id);

  /* ---------- Helpers ---------- */
  function colorFor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
  function makeAvatar(name, small) {
    const a = document.createElement("div");
    a.className = "avatar" + (small ? " sm" : "");
    a.style.background = colorFor(name);
    a.textContent = name.charAt(0).toUpperCase();
    return a;
  }
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function hhmm(iso) { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(iso) {
    const d = new Date(iso), today = new Date(), y = new Date();
    y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return "Aaj";
    if (d.toDateString() === y.toDateString()) return "Kal";
    return d.toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
  }
  function listTime(iso) {
    return new Date(iso).toDateString() === new Date().toDateString() ? hhmm(iso) : dayLabel(iso);
  }

  function lastSeenText(iso) { return dayLabel(iso).toLowerCase() + " " + hhmm(iso); }
  function updateTitle() {
    const n = chats.reduce((sum, c) => sum + (c.unread || 0), 0);
    document.title = n ? `(${n}) Guftagu` : "Guftagu";
  }
  function avatarWithDot(c, small) {
    const w = el("div", "av-wrap");
    w.appendChild(makeAvatar(c.name, small));
    if (c.online) w.appendChild(el("span", "dot"));
    return w;
  }
  // Header ke neeche: typing... / online / last seen
  function updateSub() {
    const c = chats.find((x) => x.id === activeId);
    const sub = $("chat-sub");
    sub.className = "";
    if (!c) { sub.textContent = ""; return; }
    if (typingNow) { sub.textContent = "typing..."; sub.className = "live"; }
    else if (c.online) { sub.textContent = "online"; sub.className = "live"; }
    else if (c.last_seen) { sub.textContent = "last seen " + lastSeenText(c.last_seen); }
    else { sub.textContent = ""; }
  }
  // Is chat ke messages padh liye: server ko batao, badge hatao
  function markRead() {
    const c = chats.find((x) => x.id === activeId);
    if (!c || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "read", chat_id: activeId }));
    if (c.unread) { c.unread = 0; refreshList(); }
  }

  // Har server request yahin se jaati hai, token header mein lagake
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
    });
    if (res.status === 401 && token) { logout("Login ki meaad khatam ho gayi. Dobara login karo."); throw new Error("login"); }
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const err = new Error(typeof data?.detail === "string" ? data.detail : "Kuch galat ho gaya");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  /* ---------- Login / Signup ---------- */
  function setMode(m) {
    mode = m;
    $("tab-login").classList.toggle("active", m === "login");
    $("tab-signup").classList.toggle("active", m === "signup");
    $("auth-btn").textContent = m === "login" ? "Login karo" : "Account banao";
    $("auth-error").textContent = "";
  }
  async function submitAuth() {
    const name = $("name").value.trim(), pw = $("password").value;
    if (!name || !pw) { $("auth-error").textContent = "Username aur password dono likho."; return; }
    $("auth-btn").disabled = true;
    try {
      const d = await api("/api/" + mode, { method: "POST", body: JSON.stringify({ username: name, password: pw }) });
      token = d.token; username = d.username;
      sessionStorage.setItem("guftagu_token", token);
      sessionStorage.setItem("guftagu_user", username);
      $("password").value = "";
      enterApp();
    } catch (e) {
      $("auth-error").textContent = e.status === 422
        ? "Username 3-20 akshar (a-z, 0-9, _) aur password 6-64 akshar ka hona chahiye."
        : e.message;
    } finally { $("auth-btn").disabled = false; }
  }
  function enterApp() {
    $("auth").style.display = "none";
    $("app").style.display = "block";
    $("me").textContent = username;
    loadChats();
    connectWS();
  }
  function logout(message) {
    closing = true;
    clearTimeout(reconnectTimer);
    if (ws) ws.close();
    ws = null; token = ""; username = ""; chats = []; activeId = null;
    sessionStorage.removeItem("guftagu_token");
    sessionStorage.removeItem("guftagu_user");
    $("shell").classList.remove("chat-open");
    $("chat").style.display = "none";
    $("placeholder").style.display = "";
    $("banner").style.display = "none";
    $("app").style.display = "none";
    $("auth").style.display = "grid";
    $("auth-error").textContent = message || "";
  }

  /* ---------- Chat list ---------- */
  async function loadChats() {
    chats = await api("/api/chats");
    refreshList();
    updateSub();
  }
  function refreshList() { updateTitle(); if (!$("search").value.trim()) renderList(); }
  function renderList() {
    updateTitle();
    const box = $("list");
    box.innerHTML = "";
    if (!chats.length) { box.appendChild(el("div", "note", "Abhi koi chat nahi. Upar search karke kisi dost ko dhundo.")); return; }
    chats.forEach((c) => {
      const item = el("div", "item" + (c.id === activeId ? " active" : "") + (c.unread ? " unread" : ""));
      item.appendChild(avatarWithDot(c));
      const body = el("div", "body");
      const row = el("div", "row1");
      row.appendChild(el("span", "name", c.name));
      row.appendChild(el("span", "time", c.last_text ? listTime(c.last_time) : ""));
      body.appendChild(row);
      const row2 = el("div", "row2");
      const prefix = c.last_user === username ? "Aap: " : "";
      row2.appendChild(el("div", "preview", c.last_text ? prefix + c.last_text : "Chat shuru karo"));
      if (c.unread) row2.appendChild(el("span", "badge", c.unread > 99 ? "99+" : String(c.unread)));
      body.appendChild(row2);
      item.appendChild(body);
      item.onclick = () => openChat(c.id);
      box.appendChild(item);
    });
  }

  /* ---------- Search users ---------- */
  function onSearch() {
    clearTimeout(searchTimer);
    const q = $("search").value.trim();
    if (!q) { renderList(); return; }
    searchTimer = setTimeout(async () => {
      try {
        const users = await api("/api/users/search?q=" + encodeURIComponent(q));
        if ($("search").value.trim() !== q) return; // tab tak kuch aur likh diya
        const box = $("list");
        box.innerHTML = "";
        box.appendChild(el("div", "label", "Users"));
        if (!users.length) box.appendChild(el("div", "note", "Koi user nahi mila."));
        users.forEach((u) => {
          const item = el("div", "item");
          item.appendChild(makeAvatar(u));
          const body = el("div", "body");
          body.appendChild(el("div", "name", u));
          body.appendChild(el("div", "preview", "Chat shuru karo"));
          item.appendChild(body);
          item.onclick = () => startChatWith(u);
          box.appendChild(item);
        });
      } catch (e) {}
    }, 250);
  }
  async function startChatWith(name) {
    try {
      const c = await api("/api/chats", { method: "POST", body: JSON.stringify({ username: name }) });
      if (!chats.find((x) => x.id === c.id)) chats.unshift(c);
      $("search").value = "";
      openChat(c.id);
    } catch (e) { alert(e.message); }
  }

  /* ---------- Open chat + messages ---------- */
  async function openChat(id) {
    const c = chats.find((x) => x.id === id);
    if (!c) return;
    activeId = id;
    c.unread = 0;
    typingNow = false;
    $("shell").classList.add("chat-open");
    $("placeholder").style.display = "none";
    $("chat").style.display = "flex";
    $("chat-name").textContent = c.name;
    updateSub();
    $("chat-avatar").replaceChildren(avatarWithDot(c, true));
    renderList();
    await loadMessages(id);
    $("msg").focus();
  }
  async function loadMessages(id) {
    $("messages").innerHTML = "";
    lastDay = "";
    try {
      const msgs = await api(`/api/chats/${id}/messages`);
      if (activeId !== id) return; // tab tak dusri chat khol li
      msgs.forEach(addMessage);
    } catch (e) {}
  }
  function addMessage(m) {
    const box = $("messages");
    const day = dayLabel(m.time);
    if (day !== lastDay) { box.appendChild(el("div", "day", day)); lastDay = day; }
    const b = el("div", "bubble" + (m.user === username ? " mine" : ""));
    b.appendChild(el("div", "", m.text));
    b.appendChild(el("div", "t", hhmm(m.time)));
    box.appendChild(b);
    box.scrollTop = box.scrollHeight;
  }
  function closeChat() {
    activeId = null;
    $("shell").classList.remove("chat-open");
    $("chat").style.display = "none";
    $("placeholder").style.display = "";
    renderList();
  }

  /* ---------- WebSocket ---------- */
  function connectWS() {
    clearTimeout(reconnectTimer);
    closing = false;
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
    ws = socket;

    socket.onopen = () => {
      $("banner").style.display = "none";
      if (wasDown) { wasDown = false; loadChats(); if (activeId) loadMessages(activeId); } // beech ke messages le aao
    };
    socket.onmessage = async (event) => {
      const d = JSON.parse(event.data);
      if (d.type === "message") {
        const viewing = d.chat_id === activeId && !document.hidden;
        const fromOther = d.user !== username;
        let c = chats.find((x) => x.id === d.chat_id);
        if (!c) {                       // kisi ne pehli baar message kiya
          await loadChats();            // server se unread count bhi aa jayega
        } else {
          c.last_text = d.text; c.last_user = d.user; c.last_time = d.time;
          if (fromOther && !viewing) c.unread = (c.unread || 0) + 1;
          chats = [c, ...chats.filter((x) => x !== c)];  // chat upar aa jaye
          refreshList();
        }
        if (d.chat_id === activeId) {
          addMessage(d);
          if (fromOther) { typingNow = false; updateSub(); if (viewing) markRead(); }
        }
      } else if (d.type === "typing") {
        if (d.chat_id === activeId) {
          typingNow = true; updateSub();
          clearTimeout(typingTimer);
          typingTimer = setTimeout(() => { typingNow = false; updateSub(); }, 2000);
        }
      } else if (d.type === "presence") {
        chats.forEach((c) => {
          if (c.other === d.user) { c.online = d.online; if (d.last_seen) c.last_seen = d.last_seen; }
        });
        refreshList();
        updateSub();
      }
    };
    socket.onclose = (ev) => {
      if (socket !== ws) return;
      if (ev.code === 4001) { logout("Login ki meaad khatam ho gayi. Dobara login karo."); return; }
      if (closing) return;
      wasDown = true;
      $("banner").style.display = "block";
      reconnectTimer = setTimeout(connectWS, 2500);
    };
  }
  function sendMessage() {
    const input = $("msg"), text = input.value.trim();
    if (!text || !activeId || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "message", chat_id: activeId, text }));
    input.value = "";
  }
  function sendTyping() {
    if (!activeId || !ws || ws.readyState !== WebSocket.OPEN) return;
    const now = Date.now();
    if (now - lastTypingSent > 1000) { ws.send(JSON.stringify({ type: "typing", chat_id: activeId })); lastTypingSent = now; }
  }

  /* ---------- Events ---------- */
  $("tab-login").onclick = () => setMode("login");
  $("tab-signup").onclick = () => setMode("signup");
  $("auth-btn").onclick = submitAuth;
  $("name").addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });
  $("logout").onclick = () => logout("");
  $("search").addEventListener("input", onSearch);
  $("send").onclick = sendMessage;
  $("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  $("msg").addEventListener("input", sendTyping);
  $("back").onclick = closeChat;
  document.addEventListener("visibilitychange", () => { if (!document.hidden && activeId) markRead(); });

  // Page khulte hi: pehle se login hai kya?
  token = sessionStorage.getItem("guftagu_token") || "";
  username = sessionStorage.getItem("guftagu_user") || "";
  if (token && username) enterApp(); else { token = ""; username = ""; }
</script>
</body>
</html>
