<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guftagu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24224f;
    --ink-soft: #3a3770;
    --ink-text: #e9e8fb;
    --ink-muted: #a9a6d6;
    --bg: #f4f3fa;
    --card: #ffffff;
    --line: #e3e1f0;
    --text: #25233f;
    --muted: #7c7a9a;
    --accent: #f2a93b;
    --accent-dark: #c98412;
    --online: #3dbb7a;
    --radius: 16px;
    --font-head: "Baloo 2", "Segoe UI", sans-serif;
    --font-body: "Hind", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 16px; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---------- Join screen ---------- */
  #join {
    min-height: 100%; display: grid; place-items: center; padding: 20px;
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 100%);
  }
  .join-card {
    width: 100%; max-width: 400px; background: var(--card); border-radius: 24px; padding: 36px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
  }
  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .logo-mark {
    width: 46px; height: 46px; border-radius: 14px 14px 14px 4px; background: var(--accent);
    display: grid; place-items: center; font-family: var(--font-head); font-weight: 700; font-size: 26px; color: var(--ink);
  }
  .logo h1 { font-family: var(--font-head); font-size: 32px; line-height: 1; color: var(--ink); }
  .tagline { color: var(--muted); margin-bottom: 26px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
  .field { margin-bottom: 18px; }
  input[type=text] {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fbfbfe;
  }
  input[type=text]:focus { border-color: var(--ink-soft); outline: none; box-shadow: 0 0 0 3px rgba(242,169,59,.45); }
  .room-pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .room-pick button {
    padding: 8px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-weight: 500;
  }
  .room-pick button.active { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn-primary {
    width: 100%; padding: 13px; border: 0; border-radius: 12px; background: var(--accent); color: var(--ink);
    font-family: var(--font-head); font-weight: 700; font-size: 18px; cursor: pointer; transition: background .15s;
  }
  .btn-primary:hover { background: #f5b653; }
  #join-error { color: #c0392b; font-size: 14px; min-height: 20px; margin-bottom: 8px; }

  /* ---------- App layout ---------- */
  #app { display: none; height: 100%; }
  .shell { display: grid; grid-template-columns: 270px 1fr; height: 100%; }

  .sidebar {
    background: var(--ink); color: var(--ink-text); display: flex; flex-direction: column; padding: 20px 16px; overflow-y: auto;
  }
  .sidebar .logo h1 { color: #fff; font-size: 26px; }
  .sidebar .logo-mark { width: 38px; height: 38px; font-size: 21px; }
  .sidebar h3 { font-family: var(--font-head); font-size: 15px; font-weight: 500; color: var(--ink-muted); margin: 26px 0 8px; }
  .room-list { list-style: none; }
  .room-list button {
    width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px; background: transparent;
    color: var(--ink-text); cursor: pointer; font-weight: 500;
  }
  .room-list button:hover { background: rgba(255,255,255,.08); }
  .room-list button.active { background: var(--ink-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .user-list { list-style: none; }
  .user-list li { display: flex; align-items: center; gap: 10px; padding: 7px 4px; }
  .user-list .me { color: var(--ink-muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--online); margin-left: auto; flex: none; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-family: var(--font-head); font-weight: 700; color: #fff; font-size: 16px;
  }
  .leave {
    margin-top: auto; padding: 10px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.2);
    background: transparent; color: var(--ink-text); cursor: pointer;
  }
  .leave:hover { background: rgba(255,255,255,.08); }

  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 22px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .menu-btn { display: none; border: 0; background: transparent; font-size: 24px; cursor: pointer; color: var(--ink); }
  .topbar h2 { font-family: var(--font-head); font-size: 22px; color: var(--ink); line-height: 1.1; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #bbb; }
  .status.live::before { background: var(--online); }
  .status.off::before { background: #d9534f; }

  #messages { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 260px; }
  .empty b { display: block; font-family: var(--font-head); font-size: 20px; color: var(--ink); margin-bottom: 4px; }

  .row { display: flex; gap: 10px; align-items: flex-end; max-width: 78%; }
  .row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .bubble {
    padding: 9px 14px; border-radius: 18px 18px 18px 4px; background: var(--card); border: 1px solid var(--line);
    overflow-wrap: anywhere; line-height: 1.45;
  }
  .row.mine .bubble { background: var(--ink); color: #fff; border-color: var(--ink); border-radius: 18px 18px 4px 18px; }
  .who { font-size: 13px; font-weight: 600; margin-bottom: 1px; }
  .time { font-size: 11px; opacity: .6; margin-top: 2px; text-align: right; }
  .system { align-self: center; font-size: 13px; color: var(--muted); background: #eceaf7; padding: 4px 14px; border-radius: 999px; }

  .typing { height: 24px; padding: 0 24px; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .typing .dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin-right: 2px;
    animation: bounce 1s infinite;
  }
  .typing .dots span:nth-child(2) { animation-delay: .15s; }
  .typing .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

  .composer { display: flex; gap: 10px; padding: 14px 22px 18px; background: var(--bg); }
  .composer input {
    flex: 1; padding: 13px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
  }
  .composer input:focus { border-color: var(--ink-soft); outline: none; box-shadow: 0 0 0 3px rgba(242,169,59,.45); }
  .send {
    width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--accent); color: var(--ink);
    cursor: pointer; display: grid; place-items: center; flex: none; transition: background .15s;
  }
  .send:hover { background: #f5b653; }
  .send svg { width: 22px; height: 22px; }

  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .add-room { display: flex; gap: 6px; margin-top: 8px; }
  .add-room input {
    flex: 1; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08); color: #fff;
  }
  .add-room input::placeholder { color: var(--ink-muted); }
  .add-room input:focus { outline: none; border-color: var(--accent); }
  .add-room button {
    width: 40px; border: 0; border-radius: 10px; background: var(--accent); color: var(--ink);
    font-size: 22px; font-weight: 700; cursor: pointer;
  }
  .room-error { color: #ffb4a8; font-size: 13px; min-height: 18px; margin-top: 6px; }
  .scrim { display: none; }

  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 20; transform: translateX(-100%); transition: transform .25s;
    }
    .sidebar.open { transform: translateX(0); }
    .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
    .menu-btn { display: block; }
    .row { max-width: 90%; }
    #messages, .composer { padding-left: 14px; padding-right: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ============ JOIN SCREEN ============ -->
<section id="join">
  <div class="join-card">
    <div class="logo"><div class="logo-mark">ग</div><h1>Guftagu</h1></div>
    <p class="tagline">Dosto ke saath live baatein.</p>

    <div class="field">
      <label for="name">Apna naam</label>
      <input id="name" type="text" maxlength="20" placeholder="Jaise: Jai" autocomplete="off">
    </div>
    <div class="field">
      <label for="room-input">Room ka naam</label>
      <input id="room-input" type="text" maxlength="20" placeholder="Jaise: dosto-ka-adda" autocomplete="off">
      <div class="hint">Jo naam likhoge wahi room ban jayega. Dost bhi yahi naam likhein toh tumhare saath judenge.</div>
    </div>
    <div id="join-error"></div>
    <button class="btn-primary" id="join-btn">Chat shuru karo</button>
  </div>
</section>

<!-- ============ CHAT APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><div class="logo-mark">ग</div><h1>Guftagu</h1></div>

      <h3>Rooms</h3>
      <ul class="room-list" id="room-list"></ul>
      <div class="add-room">
        <input id="new-room" type="text" maxlength="20" placeholder="Naya room banao" autocomplete="off">
        <button id="add-room-btn" aria-label="Room banao">+</button>
      </div>
      <div class="room-error" id="room-error"></div>

      <h3>Online abhi (<span id="user-count">0</span>)</h3>
      <ul class="user-list" id="user-list"></ul>

      <button class="leave" id="leave-btn">Bahar niklo</button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu kholo">☰</button>
        <div>
          <h2 id="room-title"># General</h2>
          <div class="status" id="status">Connect ho raha hai</div>
        </div>
      </header>

      <div id="messages"></div>
      <div class="typing" id="typing"></div>

      <div class="composer">
        <input id="msg" type="text" maxlength="500" placeholder="Message likho..." autocomplete="off">
        <button class="send" id="send-btn" aria-label="Message bhejo">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 22 12 3.4 3.6 3.3 10l13 2-13 2z"/></svg>
        </button>
      </div>
    </main>
  </div>
</div>

<script>
  const COLORS = ["#e4572e", "#2e86ab", "#7b4fd1", "#2a9d8f", "#d1495b", "#c98412", "#4361ee", "#6a994e"];

  let ws = null;
  let username = "";
  let room = "";
  let myRooms = []; // jin rooms mein aap ja chuke ho
  let lastTypingSent = 0;
  let intentionalClose = false;
  let reconnectTimer = null;
  const typers = {}; // { name: timeoutId }

  const $ = (id) => document.getElementById(id);

  function colorFor(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function makeAvatar(name) {
    const a = document.createElement("div");
    a.className = "avatar";
    a.style.background = colorFor(name);
    a.textContent = name.charAt(0).toUpperCase();
    return a;
  }
  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  /* ---------- Join screen ---------- */
  function cleanRoom(raw) {
    // chhota karo, space ko - banao, taaki "Cricket Fans" aur "cricket-fans" ek hi room ho
    return raw.trim().toLowerCase().replace(/\s+/g, "-");
  }
  function validRoom(r) {
    return r.length > 0 && /^[\w\u0900-\u097F-]+$/.test(r);
  }

  function startChat() {
    const name = $("name").value.trim();
    if (!name) { $("join-error").textContent = "Pehle apna naam likho."; return; }
    if (!/^[\w\u0900-\u097F -]+$/.test(name)) {
      $("join-error").textContent = "Naam mein sirf akshar, number, space ya - use karo.";
      return;
    }
    const r = cleanRoom($("room-input").value);
    if (!validRoom(r)) {
      $("join-error").textContent = "Room ka naam likho (sirf akshar, number ya -).";
      return;
    }
    username = name;
    room = r;
    if (!myRooms.includes(r)) myRooms.push(r);
    $("join").style.display = "none";
    $("app").style.display = "block";
    renderRooms();
    connect();
    $("msg").focus();
  }

  /* ---------- Sidebar ---------- */
  function renderRooms() {
    const ul = $("room-list");
    ul.innerHTML = "";
    myRooms.forEach((r) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = "# " + r;
      if (r === room) b.className = "active";
      b.onclick = () => { switchRoom(r); closeMenu(); };
      li.appendChild(b);
      ul.appendChild(li);
    });
    $("room-title").textContent = "# " + room;
  }

  function switchRoom(r) {
    if (r === room) return;
    room = r;
    renderRooms();
    connect();
  }

  function addRoom() {
    const r = cleanRoom($("new-room").value);
    if (!validRoom(r)) {
      $("room-error").textContent = "Naam mein sirf akshar, number ya - chalega.";
      return;
    }
    $("room-error").textContent = "";
    $("new-room").value = "";
    if (!myRooms.includes(r)) myRooms.push(r);
    switchRoom(r);
    closeMenu();
  }

  function renderUsers(users) {
    const ul = $("user-list");
    ul.innerHTML = "";
    $("user-count").textContent = users.length;
    users.forEach((u) => {
      const li = document.createElement("li");
      li.appendChild(makeAvatar(u));
      const span = document.createElement("span");
      span.textContent = u;
      li.appendChild(span);
      if (u === username) {
        const me = document.createElement("span");
        me.className = "me";
        me.textContent = "(aap)";
        li.appendChild(me);
      }
      const dot = document.createElement("span");
      dot.className = "dot";
      li.appendChild(dot);
      ul.appendChild(li);
    });
  }

  /* ---------- Messages ---------- */
  function showEmpty() {
    $("messages").innerHTML = "";
    const d = document.createElement("div");
    d.className = "empty";
    d.id = "empty";
    d.innerHTML = "<b>Abhi koi message nahi</b>Pehla message bhejkar baat shuru karo.";
    $("messages").appendChild(d);
  }
  function removeEmpty() { const e = $("empty"); if (e) e.remove(); }
  function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

  function addSystem(text) {
    removeEmpty();
    const d = document.createElement("div");
    d.className = "system";
    d.textContent = text;
    $("messages").appendChild(d);
    scrollDown();
  }

  function addMessage(user, text) {
    removeEmpty();
    const mine = user === username;
    const row = document.createElement("div");
    row.className = "row" + (mine ? " mine" : "");
    if (!mine) row.appendChild(makeAvatar(user));

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (!mine) {
      const who = document.createElement("div");
      who.className = "who";
      who.style.color = colorFor(user);
      who.textContent = user;
      bubble.appendChild(who);
    }
    const body = document.createElement("div");
    body.textContent = text;
    bubble.appendChild(body);
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = nowTime();
    bubble.appendChild(t);

    row.appendChild(bubble);
    $("messages").appendChild(row);
    scrollDown();
  }

  /* ---------- Typing indicator ---------- */
  function renderTyping() {
    const names = Object.keys(typers);
    const box = $("typing");
    if (!names.length) { box.innerHTML = ""; return; }
    const label = names.length === 1 ? names[0] + " type kar raha hai" : names.join(", ") + " type kar rahe hain";
    box.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
    const s = document.createElement("span");
    s.textContent = label;
    box.appendChild(s);
  }
  function someoneTyping(name) {
    clearTimeout(typers[name]);
    typers[name] = setTimeout(() => { delete typers[name]; renderTyping(); }, 2000);
    renderTyping();
  }
  function clearTypers() {
    Object.keys(typers).forEach((k) => { clearTimeout(typers[k]); delete typers[k]; });
    renderTyping();
  }

  /* ---------- WebSocket ---------- */
  function setStatus(text, cls) {
    const s = $("status");
    s.textContent = text;
    s.className = "status " + (cls || "");
  }

  function connect() {
    clearTimeout(reconnectTimer);
    if (ws) { intentionalClose = true; ws.close(); }
    showEmpty();
    clearTypers();
    renderUsers([]);
    renderRooms();
    setStatus("Connect ho raha hai", "");

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws/${encodeURIComponent(room)}/${encodeURIComponent(username)}`);
    ws = socket;
    intentionalClose = false;

    socket.onopen = () => setStatus("Live", "live");

    socket.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "message") {
        delete typers[data.user]; renderTyping();
        addMessage(data.user, data.text);
      } else if (data.type === "system") {
        addSystem(data.text);
      } else if (data.type === "users") {
        renderUsers(data.users);
      } else if (data.type === "typing") {
        someoneTyping(data.user);
      }
    };

    socket.onclose = () => {
      if (socket !== ws) return; // purana connection, ignore
      if (intentionalClose) return;
      setStatus("Connection toot gaya, dobara try ho raha hai", "off");
      reconnectTimer = setTimeout(connect, 2500);
    };
  }

  function sendMessage() {
    const input = $("msg");
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "message", text }));
    input.value = "";
  }

  function sendTyping() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const now = Date.now();
    if (now - lastTypingSent > 1000) {
      ws.send(JSON.stringify({ type: "typing" }));
      lastTypingSent = now;
    }
  }

  function leave() {
    intentionalClose = true;
    clearTimeout(reconnectTimer);
    if (ws) ws.close();
    ws = null;
    myRooms = [];
    room = "";
    $("app").style.display = "none";
    $("join").style.display = "grid";
    $("join-error").textContent = "";
    closeMenu();
  }

  /* ---------- Mobile menu ---------- */
  function openMenu() { $("sidebar").classList.add("open"); $("scrim").classList.add("open"); }
  function closeMenu() { $("sidebar").classList.remove("open"); $("scrim").classList.remove("open"); }

  /* ---------- Events ---------- */
  $("join-btn").onclick = startChat;
  $("name").addEventListener("keydown", (e) => { if (e.key === "Enter") startChat(); });
  $("send-btn").onclick = sendMessage;
  $("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });
  $("msg").addEventListener("input", sendTyping);
  $("leave-btn").onclick = leave;
  $("menu-btn").onclick = openMenu;
  $("scrim").onclick = closeMenu;

  $("add-room-btn").onclick = addRoom;
  $("new-room").addEventListener("keydown", (e) => { if (e.key === "Enter") addRoom(); });
  $("room-input").addEventListener("keydown", (e) => { if (e.key === "Enter") startChat(); });
</script>
</body>
</html>
